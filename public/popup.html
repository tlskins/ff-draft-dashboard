<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Drafty Draft Sync</title>
    <style>
      body {
        min-width: 280px;
        margin: 0;
        padding: 14px;
        font-family: system-ui, sans-serif;
        color: #1f2937;
        background: #f8fafc;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      p {
        margin: 6px 0;
        font-size: 13px;
        line-height: 1.4;
      }

      .status {
        border-left: 3px solid #2563eb;
        padding-left: 9px;
      }

      .version {
        color: #64748b;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Drafty Draft Sync</h1>
    <p class="status">Listening for picks on supported ESPN and NFL.com draft pages.</p>
    <p>Draft picks and league metadata are relayed only to an open Drafty dashboard tab.</p>
    <p class="version">Version 0.0.0.12</p>
  </body>
</html>
